# =============================================================================
# lakefile.toml - Lean 4 项目配置文件
# =============================================================================
#
# 这个文件是 Lake 构建系统的配置，类似于：
# - Rust 的 Cargo.toml
# - Node.js 的 package.json
# - Python 的 pyproject.toml
#
# Lake 是 Lean 4 的官方构建工具，负责：
# - 管理依赖
# - 编译项目
# - 运行测试
# - 生成文档
# =============================================================================

# -----------------------------------------------------------------------------
# 项目基本信息
# -----------------------------------------------------------------------------
name = "hello"           # 项目名称（小写，用于生成的可执行文件名）
version = "0.1.0"        # 版本号（语义化版本：主.次.补丁）
defaultTargets = ["hello"]  # 默认构建目标（运行 lake build 时构建哪些）

# -----------------------------------------------------------------------------
# 依赖配置
# -----------------------------------------------------------------------------
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.15.0"

# -----------------------------------------------------------------------------
# 库配置 [[lean_lib]]
# -----------------------------------------------------------------------------
# 定义一个 Lean 库
# 库是一组可重用的模块，可以被其他项目导入
[[lean_lib]]
name = "Hello"           # 库的名称（大写开头是 Lean 惯例）
                         # 对应入口文件：Hello.lean

# 可选配置（取消注释使用）：
# roots = ["Hello"]      # 库的根模块（默认与 name 相同）
# srcDir = "."           # 源文件目录（默认是当前目录）
# precompileModules = false  # 是否预编译模块（加快后续构建）

# -----------------------------------------------------------------------------
# 可执行文件配置 [[lean_exe]]
# -----------------------------------------------------------------------------
# 定义一个可执行程序
# 项目可以有多个可执行文件，每个对应一个入口文件
[[lean_exe]]
name = "hello"           # 可执行文件名（构建后生成 build/bin/hello）
root = "Main"            # 入口模块（对应 Main.lean）
                         # main 函数必须在这个文件中定义

# 可选配置（取消注释使用）：
# supportInterpreter = true  # 支持 lean --run 解释执行
# exeName = "hello-bin"     # 自定义可执行文件名（与 name 不同）

# =============================================================================
# 常用 Lake 命令速查
# =============================================================================
#
# 构建相关：
#   lake build              构建默认目标
#   lake build hello        构建指定目标
#   lake clean              清理构建产物
#
# 运行相关：
#   lake exe hello          运行可执行文件
#   lake env lean --run Main.lean   解释执行（不生成二进制）
#
# 依赖管理：
#   lake update             更新依赖
#   lake resolve            解析依赖
#
# 测试相关：
#   lake test               运行测试（如果配置了）
#
# 其他：
#   lake init <name>        初始化新项目
#   lake new <name>         创建新项目（在新目录中）
#
# =============================================================================

# -----------------------------------------------------------------------------
# 依赖配置示例（取消注释并修改以使用）
# -----------------------------------------------------------------------------
# 如果你想使用 Mathlib（Lean 的数学库），可以这样添加依赖：
#
# [[require]]
# name = "mathlib"
# git = "https://github.com/leanprover-community/mathlib4"
#
# 或者使用本地路径：
# [[require]]
# name = "mylib"
# path = "../mylib"
#
# =============================================================================
